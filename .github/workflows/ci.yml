name: Android CI

# 单模块 app 的四项独立检查；release 仅验证 R8，不在 CI 中签名或发布 APK。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            task: :app:testDebugUnitTest
            report_name: test-results
            report_path: app/build/reports/tests/testDebugUnitTest/
          - name: Android Lint
            task: :app:lintDebug
            report_name: lint-results
            report_path: app/build/reports/lint-results-debug.html
          - name: Assemble debug
            task: :app:assembleDebug
            report_name: ''
            report_path: ''
          - name: Minify release (R8)
            task: :app:minifyReleaseWithR8
            report_name: ''
            report_path: ''

    steps:
      - uses: actions/checkout@v4

      # 与 gradle/gradle-daemon-jvm.properties 中的 Java 21 保持一致。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 与 app/build.gradle.kts 的 compileSdk 37 保持一致。
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.name }}
        run: ./gradlew ${{ matrix.task }} --console=plain

      - name: Upload report
        if: ${{ always() && matrix.report_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.report_path }}
          if-no-files-found: ignore
          retention-days: 7
